# Security headers for the Квартира frontend (nginx).
#
# The Content-Security-Policy meta tag is injected into index.html at build time
# (see the `kvartira-csp` plugin in vite.config.ts). Two directives are ignored
# inside a meta tag and must be sent as real headers — that is what this file is
# for. Include it from the `server` block that serves `dist/`:
#
#   include /etc/nginx/snippets/kvartira-security-headers.conf;

# Clickjacking. `frame-ancestors` in the meta CSP is ignored by browsers.
add_header X-Frame-Options "DENY" always;
add_header Content-Security-Policy "frame-ancestors 'none'" always;

# Do not leak the full URL (which can contain an invite token) to third parties.
add_header Referrer-Policy "strict-origin-when-cross-origin" always;

# No MIME sniffing on uploaded attachments served through the app.
add_header X-Content-Type-Options "nosniff" always;

# HTTPS only, once the certificate is confirmed working.
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

# The app needs none of these.
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), interest-cohort=()" always;

# PocketBase is proxied under /api — it must never be cached by a shared proxy.
location /api/ {
    proxy_pass http://127.0.0.1:8090;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Realtime (SSE) subscriptions used by chat.
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_buffering off;
    proxy_read_timeout 1h;

    add_header Cache-Control "no-store" always;
}
