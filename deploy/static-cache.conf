/**
 * Long-cache hashed Vite assets. Include from the `server` block that serves `dist/`:
 *
 *   include /etc/nginx/snippets/kvartira-static-cache.conf;
 *
 * Pair with deploy/security-headers.conf. External CDN (if any) should origin-pull the same `dist/`.
 */

# Hashed JS/CSS/fonts under /assets/ — immutable filenames from Vite.
location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    try_files $uri =404;
}

# HTML entry must always revalidate so clients pick up new asset hashes.
location = /index.html {
    add_header Cache-Control "no-cache" always;
    try_files $uri =404;
}

location = / {
    add_header Cache-Control "no-cache" always;
    try_files /index.html =404;
}
