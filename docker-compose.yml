# PocketBase for local dev — see pocketbase/README.md
services:
  pocketbase:
    image: ghcr.io/muchobien/pocketbase:0.28.4
    container_name: kvartira-pocketbase
    restart: unless-stopped
    ports:
      - '${PB_HTTP_PORT:-8090}:8090'
    volumes:
      - ./pocketbase/pb_data:/pb_data
      - ./pocketbase/pb_migrations:/pb_migrations
      - ./pocketbase/pb_hooks:/pb_hooks
    environment:
      WEB_PUSH_RELAY_URL: ${WEB_PUSH_RELAY_URL:-}
      WEB_PUSH_RELAY_SECRET: ${WEB_PUSH_RELAY_SECRET:-}
      KVARTIRA_DEV: ${KVARTIRA_DEV:-}
      VAPID_PUBLIC_KEY: ${VITE_VAPID_PUBLIC_KEY:-}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
      VAPID_SUBJECT: ${VAPID_SUBJECT:-mailto:admin@kvartira.local}
      YCLIENTS_COMPANY_ID: ${YCLIENTS_COMPANY_ID:-}
      YCLIENTS_PARTNER_TOKEN: ${YCLIENTS_PARTNER_TOKEN:-}
      YCLIENTS_USER_TOKEN: ${YCLIENTS_USER_TOKEN:-}
      YCLIENTS_API_BASE: ${YCLIENTS_API_BASE:-}
    healthcheck:
      test: ['CMD', 'wget', '--no-verbose', '--tries=1', '--spider', 'http://127.0.0.1:8090/api/health']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
