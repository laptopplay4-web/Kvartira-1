<!doctype html>
  <html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    <!--
      Content-Security-Policy is injected at build time by the `kvartira-csp`
      plugin in vite.config.ts — it needs VITE_API_URL and the hash of the
      inline script below. frame-ancestors / X-Frame-Options must be sent as
      real HTTP headers: see deploy/security-headers.conf.
    -->
    <script>
      (function () {
        var theme = localStorage.getItem('kvartira-theme');
        if (theme === 'light' || theme === 'dark') {
          document.documentElement.setAttribute('data-theme', theme);
        }
      })();
    </script>
    <link rel="icon" type="image/png" href="/assets/logo.png" />
    <meta name="theme-color" content="#00796b" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700&family=Playfair+Display:wght@500;600;700&display=swap" rel="stylesheet" />
    <title>Квартира</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
